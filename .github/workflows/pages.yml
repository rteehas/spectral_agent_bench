name: Deploy review site

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Validate benchmark data and local evidence
        run: python3 scripts/validate_data.py
      - name: Check JavaScript syntax
        run: node --check docs/assets/app.js
      - name: Version browser assets for this deployment
        if: github.event_name != 'pull_request'
        run: |
          python3 - <<'PYTHON'
          import os
          from pathlib import Path
          page = Path('docs/index.html')
          html = page.read_text()
          version = os.environ['GITHUB_SHA']
          for asset in ('assets/app.js', 'assets/style.css'):
              html = html.replace(f'"{asset}"', f'"{asset}?v={version}"')
          page.write_text(html)
          PYTHON
      - name: Upload website
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs

  deploy:
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
